[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: tests that do not require Qt, a game installation, or external files
    integration: tests that use repository-generated files or export pipelines
    slow: long-running tests (byte diff, complete export, and similar checks)
    game_install: tests that require a local Hearts of Iron IV installation
    workshop: optional compatibility probes for local Workshop content
    engine: tests that launch the closed-source game; never a normal CI requirement
